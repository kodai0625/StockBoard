<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22332a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock Board">
<title>Stock Board</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/stock.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css?v=d14d5f8d">
</head>
<body>

<header class="head">
  <div class="head-top">
    <div class="brand">
      <img class="logo" src="icons/stock.svg" width="26" height="26" alt="">
      <span>Stock Board</span>
      <small>うちの在庫</small>
    </div>
    <div class="head-r">
    <button type="button" class="hbtn" id="editBtn">編集</button>
    <button type="button" class="gear" id="setBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/><path fill="currentColor" d="m19.4 13-.1-1 .1-1 1.6-1.2a.6.6 0 0 0 .2-.8l-1.6-2.7a.6.6 0 0 0-.7-.3l-1.9.7a6.9 6.9 0 0 0-1.7-1l-.3-2a.6.6 0 0 0-.6-.5h-3.2a.6.6 0 0 0-.6.5l-.3 2a6.9 6.9 0 0 0-1.7 1l-1.9-.7a.6.6 0 0 0-.7.3L4.4 9a.6.6 0 0 0 .2.8L6.2 11l-.1 1 .1 1-1.6 1.2a.6.6 0 0 0-.2.8l1.6 2.7c.1.3.4.4.7.3l1.9-.7c.5.4 1.1.8 1.7 1l.3 2c0 .3.3.5.6.5h3.2c.3 0 .6-.2.6-.5l.3-2c.6-.2 1.2-.6 1.7-1l1.9.7c.3.1.6 0 .7-.3l1.6-2.7a.6.6 0 0 0-.2-.8L19.4 13Zm-1.6 3.6-1.6-.6-.7.6c-.4.3-.9.6-1.4.8l-.9.3-.3 1.7h-1.8l-.3-1.7-.9-.3c-.5-.2-1-.5-1.4-.8l-.7-.6-1.6.6-.9-1.5 1.4-1-.1-.9a5.6 5.6 0 0 1 0-1.6l.1-.9-1.4-1 .9-1.5 1.6.6.7-.6c.4-.3.9-.6 1.4-.8l.9-.3.3-1.7h1.8l.3 1.7.9.3c.5.2 1 .5 1.4.8l.7.6 1.6-.6.9 1.5-1.4 1 .1.9a5.6 5.6 0 0 1 0 1.6l-.1.9 1.4 1-.9 1.5Z"/></svg>
    </button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab t-spice" data-view="spice" role="tab">調味料<span class="cnt" hidden></span></button>
    <button type="button" class="tab t-supply" data-view="supply" role="tab">備品<span class="cnt" hidden></span></button>
    <button type="button" class="tab t-bousai" data-view="bousai" role="tab">防災<span class="cnt" hidden></span></button>
    <button type="button" class="tab t-shop" data-view="shop" role="tab">買い出し<span class="cnt" hidden></span></button>
  </nav>
</header>

<main id="main"></main>

<button type="button" class="fab" id="fab" aria-label="品を足す">＋</button>

<datalist id="units">
  <option value="本"><option value="個"><option value="袋"><option value="箱"><option value="パック">
  <option value="ロール"><option value="枚"><option value="缶"><option value="食"><option value="回"><option value="組"><option value="台">
</datalist>

<!-- 下から出る入れ物（品を足す・直す、よくある品から選ぶ、買った、設定） -->
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <b id="sheetTitle"></b>
    <button type="button" class="sheet-x" id="sheetX" aria-label="閉じる">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/seeds.js?v=d14d5f8d"></script>
<script src="js/store.js?v=d14d5f8d"></script>
<script src="js/app.js?v=d14d5f8d"></script>
</body>
</html>
